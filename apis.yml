name: Biotyx Medical
description: 'Biotyx Medical (Shenzhen) Co., Ltd. is a medical device company founded
  in 2019 as a subsidiary of LifeTech Scientific Corporation (HKEX: 01302), headquartered
  in Shenzhen, China. It develops iron-based bioresorbable vascular scaffolds (the IBS
  platform) for coronary, peripheral, and congenital cardiovascular disease, and is
  the only company in the world commercializing iron-based bioresorbable stents. Its
  products include the IBS Coronary Scaffold, IBS Titan peripheral scaffold, and IBS
  Angel pulmonary artery scaffold, with NMPA innovative-device approvals, US and Malaysia
  sales licenses, and CE certification. This is a medical device manufacturer with no
  public developer, API, or technology-platform surface; it was surfaced as a portfolio
  company of IDG Capital and added to the API Evangelist network for tracking.'
